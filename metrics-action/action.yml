name: 'MemBrowse - Benchmark Metrics'
description: 'Attach benchmark metrics (cycle counts, timings, scores) to a commit of a MemBrowse target.'
author: 'MemBrowse'

inputs:
  target_name:
    description: 'Target the metrics belong to, like esp32 or stm32f4. It must already have a memory report on MemBrowse.'
    required: true
  api_key:
    description: 'MemBrowse project API key'
    required: true
  metrics:
    description: |
      Metrics, one per line, as NAME=VALUE or NAME=VALUE UNIT. Blank lines
      and lines starting with # are ignored. Values usually come from an
      earlier step's outputs. Example:
        Boot time=${{ steps.bench.outputs.boot_ms }} ms
        CoreMark=${{ steps.bench.outputs.coremark }}
    required: false
    default: ''
  metrics_file:
    description: |
      Path to a JSON file of metrics, e.g. written by a benchmark harness:
        {"Message Passing": {"value": 412, "unit": "cycles"}, "Synchronization": 389.5}
      Metrics from the `metrics` input override the same names from the file.
    required: false
    default: ''
  commit:
    description: 'Full commit SHA the metrics were measured at (default: the commit of the event - the pull request head for pull_request events)'
    required: false
    default: ''
  api_url:
    description: 'MemBrowse API base URL'
    required: false
    default: 'https://api.membrowse.com'
  verbose:
    description: 'Set logging level: DEBUG, INFO, or WARNING (default: WARNING)'
    required: false
    default: 'WARNING'

runs:
  using: 'composite'
  steps:
    - name: Check for existing Python
      id: has-python
      if: ${{ job.container.id == '' }}
      shell: bash
      run: |
        if command -v python3 &>/dev/null || command -v python &>/dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      id: setup-python
      if: ${{ job.container.id == '' }}
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        # Leave the caller's Python on PATH so their build keeps the version
        # they chose; only expose ours when there is no Python at all.
        update-environment: ${{ steps.has-python.outputs.found != 'true' }}

    - name: Detect Python interpreter
      id: detect-python
      shell: bash
      env:
        SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      run: |
        if [ -n "$SETUP_PYTHON_PATH" ]; then
          PYTHON="$SETUP_PYTHON_PATH"
        elif command -v python3 &>/dev/null; then
          PYTHON=python3
        elif command -v python &>/dev/null; then
          PYTHON=python
        else
          echo "::error::Python not found. Python + pip must be present in the job container image, or run this action outside a container."
          exit 1
        fi
        if ! "$PYTHON" -m pip --version &>/dev/null; then
          echo "::error::pip not found for $PYTHON. Python + pip must be present in the job container image, or run this action outside a container."
          exit 1
        fi
        echo "python=$PYTHON" >> "$GITHUB_OUTPUT"

    - name: Install membrowse package
      shell: bash
      run: |
        INSTALL_PATH="${{ github.action_path }}/.."
        # In container jobs, github.action_path uses the host path which doesn't
        # exist inside the container. Derive the container prefix from GITHUB_WORKSPACE.
        if [ ! -d "$INSTALL_PATH" ]; then
          if [[ "$INSTALL_PATH" == */_actions/* ]] && [ -n "${GITHUB_WORKSPACE:-}" ]; then
            HOST_PREFIX="${INSTALL_PATH%%/_actions/*}"
            CONTAINER_PREFIX="${GITHUB_WORKSPACE%/*/*}"
            if [ -n "$CONTAINER_PREFIX" ]; then
              INSTALL_PATH="${INSTALL_PATH/$HOST_PREFIX/$CONTAINER_PREFIX}"
              echo "Resolved container install path: $INSTALL_PATH"
            fi
          fi
          if [ ! -d "$INSTALL_PATH" ]; then
            echo "::error::Could not resolve membrowse package path. Tried: ${{ github.action_path }}/.. and $INSTALL_PATH"
            exit 1
          fi
        fi
        "${{ steps.detect-python.outputs.python }}" -m pip install --force-reinstall "$INSTALL_PATH"

    - name: Upload metrics
      shell: bash
      env:
        INPUT_TARGET_NAME: ${{ inputs.target_name }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_METRICS: ${{ inputs.metrics }}
        INPUT_METRICS_FILE: ${{ inputs.metrics_file }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_API_URL: ${{ inputs.api_url }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        # Global args (before subcommand)
        GLOBAL_ARGS=()
        case "$INPUT_VERBOSE" in
          DEBUG|INFO|WARNING)
            GLOBAL_ARGS+=(--verbose "$INPUT_VERBOSE")
            ;;
          "")
            ;;
          *)
            echo "::error::Invalid verbose level: '$INPUT_VERBOSE' (expected DEBUG, INFO, or WARNING)"
            exit 1
            ;;
        esac

        if [ -z "$INPUT_METRICS" ] && [ -z "$INPUT_METRICS_FILE" ]; then
          echo "::error::Provide the 'metrics' input, the 'metrics_file' input, or both."
          exit 1
        fi

        # One metric per line; names and units may contain spaces
        METRIC_ARGS=()
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          if [ -z "$line" ] || [[ "$line" == \#* ]]; then
            continue
          fi
          METRIC_ARGS+=("$line")
        done <<< "$INPUT_METRICS"

        ARGS=(--target-name "$INPUT_TARGET_NAME" --api-key "$INPUT_API_KEY")
        if [ -n "$INPUT_API_URL" ]; then
          ARGS+=(--api-url "$INPUT_API_URL")
        fi
        if [ -n "$INPUT_METRICS_FILE" ]; then
          ARGS+=(--file "$INPUT_METRICS_FILE")
        fi
        if [ -n "$INPUT_COMMIT" ]; then
          ARGS+=(--commit-sha "$INPUT_COMMIT")
        else
          ARGS+=(--github)
        fi

        # "--" so a metric line that starts with a dash is not read as a flag
        "${{ steps.detect-python.outputs.python }}" -m membrowse "${GLOBAL_ARGS[@]}" metrics "${ARGS[@]}" -- "${METRIC_ARGS[@]}"

branding:
  icon: 'activity'
  color: 'purple'
